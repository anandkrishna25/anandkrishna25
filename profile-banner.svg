<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="200" fill="#0D1117"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#21262D" stroke-width="0.5"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#21262D" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#21262D" stroke-width="0.5"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#21262D" stroke-width="0.5"/>
  <line x1="180" y1="0" x2="180" y2="200" stroke="#21262D" stroke-width="0.5"/>
  <line x1="360" y1="0" x2="360" y2="200" stroke="#21262D" stroke-width="0.5"/>
  <line x1="540" y1="0" x2="540" y2="200" stroke="#21262D" stroke-width="0.5"/>
  <line x1="720" y1="0" x2="720" y2="200" stroke="#21262D" stroke-width="0.5"/>

  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="4" height="200" fill="#FF9900"/>

  <!-- Main title -->
  <text x="40" y="72" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#E6EDF3">
    Anand Krishna
  </text>

  <!-- Role line with orange accent -->
  <text x="40" y="108" font-family="Courier New, monospace" font-size="16" fill="#FF9900">
    AWS Cloud Security Engineer  |  DevSecOps  |  Security Automation
  </text>

  <!-- Tag line -->
  <text x="40" y="136" font-family="Courier New, monospace" font-size="13" fill="#8B949E">
    Building self-healing cloud infrastructure · Hyderabad, India
  </text>

  <!-- Badges / pills -->
  <rect x="40" y="152" width="110" height="22" rx="4" fill="#1C2128" stroke="#FF9900" stroke-width="0.5"/>
  <text x="95" y="167" font-family="Courier New, monospace" font-size="11" fill="#FF9900" text-anchor="middle">AWS Config</text>

  <rect x="160" y="152" width="110" height="22" rx="4" fill="#1C2128" stroke="#FF9900" stroke-width="0.5"/>
  <text x="215" y="167" font-family="Courier New, monospace" font-size="11" fill="#FF9900" text-anchor="middle">EventBridge</text>

  <rect x="280" y="152" width="80" height="22" rx="4" fill="#1C2128" stroke="#FF9900" stroke-width="0.5"/>
  <text x="320" y="167" font-family="Courier New, monospace" font-size="11" fill="#FF9900" text-anchor="middle">Lambda</text>

  <rect x="370" y="152" width="60" height="22" rx="4" fill="#1C2128" stroke="#3572A5" stroke-width="0.5"/>
  <text x="400" y="167" font-family="Courier New, monospace" font-size="11" fill="#3572A5" text-anchor="middle">Python</text>

  <rect x="440" y="152" width="70" height="22" rx="4" fill="#1C2128" stroke="#2EA043" stroke-width="0.5"/>
  <text x="475" y="167" font-family="Courier New, monospace" font-size="11" fill="#2EA043" text-anchor="middle">DevSecOps</text>

  <rect x="520" y="152" width="50" height="22" rx="4" fill="#1C2128" stroke="#2EA043" stroke-width="0.5"/>
  <text x="545" y="167" font-family="Courier New, monospace" font-size="11" fill="#2EA043" text-anchor="middle">SOAR</text>

  <!-- MTTR stat on right -->
  <text x="860" y="88" font-family="Courier New, monospace" font-size="11" fill="#8B949E" text-anchor="end">MTTR achieved</text>
  <text x="860" y="112" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#2EA043" text-anchor="end">&lt;3 min</text>
  <text x="860" y="132" font-family="Courier New, monospace" font-size="10" fill="#8B949E" text-anchor="end">NON_COMPLIANT → COMPLIANT</text>

  <!-- Bottom border accent -->
  <rect x="0" y="197" width="900" height="3" fill="#FF9900" opacity="0.3"/>
</svg>
